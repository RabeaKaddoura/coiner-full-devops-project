apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alb-ingress
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix 
            backend:
              service:
                name: django-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vue-service
                port:
                  number: 80