apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-db-secrets
  namespace: webapp
spec:
  provider: aws
  parameters:
    objects: | #edit
      - objectName: "arn:aws:secretsmanager:us-east-1:844586871941:secret:/production/backend-BDzP6F"
        objectType: secretsmanager
        jmesPath:
          - path: username
            objectAlias: db_username
          - path: password
            objectAlias: db_password
          - path: host
            objectAlias: db_host
          - path: port
            objectAlias: db_port
          - path: dbname
            objectAlias: db_name

  secretObjects:
    - secretName: backend-k8s-secret
      type: Opaque
      data:
        - objectName: db_username
          key: username
        - objectName: db_password
          key: password
        - objectName: db_host
          key: host
        - objectName: db_port
          key: port
        - objectName: db_name
          key: dbname
