apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: django-deployment
spec:
  replicas: 3 #total replicas for stable + canary
  strategy:
    canary:
      steps:
        - setWeight: 20 #send 20% of traffic to new version first
        - pause: {duration: 2m} #then wait 2 minutes ...
        - setWeight: 50 #raise to 50%...
        - pause: {duration: 2m} #wait 2 more minutes before 100% of pods become the new version
      stableService: django-backend-stable #services stable pods
      canaryService: django-backend-canary #services new canary pods (new pod version, say after updating the app)
      trafficRouting:
        alb:
          ingress: alb-ingress
          servicePort: 8000

  selector:
    matchLabels:
      app: django-backend
  template:
    metadata:
      labels:
        app: django-backend
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: django-coiner
          image: {{.Values.depl.image}}
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets"
              readOnly: true

          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DJANGO_SECRET_KEY
            - name: DJANGO_ALLOWED_HOSTS
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DJANGO_ALLOWED_HOSTS

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-k8s-secret
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-k8s-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-k8s-secret
                  key: password
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-k8s-secret
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-k8s-secret
                  key: port

            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: CORS_ALLOWED_ORIGINS

          resources:
            requests:
              cpu: "{{.Values.depl.cpuReq}}"
              memory: "{{.Values.depl.memoryReq}}"
            limits:
              cpu: "{{.Values.depl.cpuLim}}"
              memory: "{{.Values.depl.memoryLim}}"
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: backend-db-secrets
