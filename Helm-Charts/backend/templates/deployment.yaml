apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-deployment
spec:
  selector:
    matchLabels:
      app: django-backend
  template:
    metadata:
      labels:
        app: django-backend
    spec:
      containers:
      - name:  django-coiner
        image: {{.Values.depl.image}}
        ports:
        - containerPort: 8000

        env:
          - name: DJANGO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: backend-secret
                key: DJANGO_SECRET_KEY
          - name: DJANGO_ALLOWED_HOSTS
            valueFrom:
              secretKeyRef:
                name: backend-secret
                key: DJANGO_ALLOWED_HOSTS
          - name: DB_NAME
            valueFrom:
              secretKeyRef:
                name: backend-secret
                key: DB_NAME
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: backend-secret
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: backend-secret
                key: DB_PASSWORD
          - name: DB_HOST
            valueFrom:
              secretKeyRef:
                name: backend-secret
                key: DB_HOST
          - name: DB_PORT
            valueFrom:
              secretKeyRef:
                name: backend-secret
                key: DB_PORT
          - name: CORS_ALLOWED_ORIGINS
            valueFrom:
              secretKeyRef:
                name: backend-secret
                key: CORS_ALLOWED_ORIGINS

        resources:
          requests:
            cpu: "{{.Values.depl.cpuReq}}"
            memory: "{{.Values.depl.memoryReq}}"
          limits:
            cpu: "{{.Values.depl.cpuLim}}"
            memory: "{{.Values.depl.memoryLim}}"
