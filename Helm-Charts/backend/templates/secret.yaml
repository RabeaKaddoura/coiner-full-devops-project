apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "{{ .Values.backendSecret.DJANGO_SECRET_KEY }}"
  DJANGO_ALLOWED_HOSTS: "{{ .Values.backendSecret.DJANGO_ALLOWED_HOSTS }}"
  DB_NAME: "{{ .Values.backendSecret.DB_NAME }}"
  DB_USER: "{{ .Values.backendSecret.DB_USER }}"
  DB_PASSWORD: "{{ .Values.backendSecret.DB_PASSWORD }}"
  DB_HOST: "{{ .Values.backendSecret.DB_HOST }}"
  DB_PORT: "{{ .Values.backendSecret.DB_PORT }}"
  CORS_ALLOWED_ORIGINS: "{{ .Values.backendSecret.CORS_ALLOWED_ORIGINS }}"
