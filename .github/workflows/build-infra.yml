name: Provisioning AWS infrastructure with Terraform

on:
  push:
    branches: ["main"]
    paths:
      - "Terraform/**"
  workflow_dispatch:

jobs:
  provision-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials #authenticating to aws
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform #installing terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: ${{ vars.TF_VERSION }}

      - name: Terraform Init #downloads required terrform modules, dependincies, and sets up backend
        working-directory: ./Terraform
        run: terraform init

      - name: Terraform Format Check #checks code formatting. Doesn't fail pipeline on error
        working-directory: ./Terraform
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate #validates syntax and configurations
        working-directory: ./Terraform
        run: terraform validate

      - name: Terraform Plan #generates and saves infra plan
        working-directory: ./Terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply #provisions infra
        working-directory: ./Terraform
        run: terraform apply -auto-approve tfplan
